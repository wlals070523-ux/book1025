<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>book-class · 닿소리 채우기</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script></head>
<body><header><div class="wrap header"><a href="./index.html">▤ book-class</a><nav aria-label="화면 선택"><button id="studentMode" aria-pressed="true">학생 활동</button><button id="teacherMode" aria-pressed="false">교사 대시보드</button></nav></div></header>
<main class="wrap"><div class="intro"><small>CREATIVE READING · STEP 01</small><h1>생각이 낱말이 되는 순간,<br>닿소리 채우기</h1><p>책에서 만난 낱말과 나의 생각을 열네 개의 자음에 담아 보세요.</p></div>
<section id="studentPanel"><div class="bar"><h2>나의 닿소리 판</h2><label>활동 학생 <select id="studentSelect"></select></label></div><form id="wordForm"><label class="sr" for="wordInput">추가할 낱말</label><input id="wordInput" maxlength="24" required autocomplete="off" placeholder="책을 읽고 떠오른 낱말을 적어 보세요"><button class="primary">+ 단어 채우기</button></form><p class="hint">첫 글자의 초성으로 자동 분류해요. 쌍자음은 기본 자음에 모아요. 예: 꿈 → ㄱ</p><div id="board" class="board"></div></section>
<section id="teacherPanel" hidden><div class="bar"><h2>우리 반 생각 모아보기</h2><small>예시 학급 · DEMO CLASS</small></div><div id="stats" class="stats"></div><div class="tabs" role="tablist" aria-label="제출물 보기"><button id="individualTab" data-view="individual" role="tab" aria-controls="teacherContent" aria-selected="false" tabindex="-1">개별 보기</button><button id="allTab" data-view="all" role="tab" aria-controls="teacherContent" aria-selected="false" tabindex="-1">전체 모아보기</button><button id="cloudTab" data-view="cloud" role="tab" aria-controls="teacherContent" aria-selected="true">워드 클라우드</button></div><div id="teacherContent" role="tabpanel" aria-labelledby="cloudTab"></div></section>
<p id="status" role="status" aria-live="polite"></p><footer>book-class · 책을 넘어, 나의 생각으로<p>예시 데이터는 현재 브라우저에 저장됩니다. 다른 기기와 실시간 공유되지 않습니다.</p></footer></main>
<dialog id="dialog" aria-labelledby="dialogTitle"><form id="dialogForm"><div class="bar"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" aria-label="닫기">×</button></div><div id="dialogBody"></div></form></dialog></body></html>
